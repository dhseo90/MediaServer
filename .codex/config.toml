# MediaServer 프로젝트 전용 기본값. 다른 저장소의 전역 설정은 변경하지 않는다.
# 적용 시점은 새 세션의 설정 로딩이며, 기존 작업의 모델 선택을 강제로 바꾸지 않는다.
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

# 지침 용량 override는 두지 않는다. 상시 AGENTS는 기본 한도 안에서 관리하고,
# 상세 검증 기준은 AGENTS에서 연결한 기존 문서를 해당 작업 때 읽는다.

[agents]
# 메인을 제외한 동시 서브에이전트 상한. 기존 한 개를 순차 재사용한다.
max_concurrent_threads_per_session = 1
# 위임 깊이는 메인 → 서브에이전트 한 단계로 제한한다.
# 이 값의 파싱과 실제 중첩 호출 차단은 별개다. AGENTS의 하위 위임 금지도 따른다.
max_depth = 1

# 서브에이전트 생성 시 사용자 지정 모델·추론을 명시한다. 고정 지시가 있으면 동일하게 적용한다.
# 지원/설정을 확인할 수 없으면 임의 모델로 대체하거나 동시 인원을 늘리지 않고 메인이 맡는다.
# 이 설정은 도구 지원 여부나 AGENTS.md의 하위 에이전트 생성 금지 지침을 대체하지 않는다.
