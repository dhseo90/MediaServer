name: Preflight

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: |
          bash -n server.sh scripts/internal/*.sh

      - name: Node syntax
        shell: bash
        run: |
          for file in scripts/internal/*.mjs; do
            node --check "$file"
          done

      - name: Script inventory
        shell: bash
        run: |
          ./server.sh verify-script-inventory

      - name: Actions security
        shell: bash
        run: |
          ./server.sh verify-actions-security

      - name: Code comments
        shell: bash
        run: |
          ./server.sh verify-code-comments

      - name: Docs links
        shell: bash
        run: |
          ./server.sh verify-docs-links

      - name: Docs UI assets
        shell: bash
        run: |
          ./server.sh verify-docs-ui-assets

      - name: UI release baseline approval log presence
        shell: bash
        run: |
          ./server.sh verify-ui-release-baseline-approval-log

      - name: UI visual artifact maintenance dry-run
        shell: bash
        run: |
          ./server.sh verify-ui-visual-artifact-index --output-dir artifacts/ui-visual-maintenance-fixture/fresh
          mkdir -p artifacts/ui-visual-baseline-diff
          cp artifacts/ui-visual-maintenance-fixture/fresh/baseline-diff/visual-baseline-diff.json artifacts/ui-visual-baseline-diff/visual-baseline-diff.json
          cp artifacts/ui-visual-maintenance-fixture/fresh/baseline-diff/visual-baseline-diff.md artifacts/ui-visual-baseline-diff/visual-baseline-diff.md
          ./server.sh write-ui-visual-baseline-comment \
            --diff-report artifacts/ui-visual-baseline-diff/visual-baseline-diff.json \
            --output artifacts/ui-visual-baseline-diff/visual-baseline-comment.md
          ./server.sh ui-visual-artifact-maintenance \
            --artifact-root artifacts/ui-visual-maintenance-fixture \
            --archive-dir artifacts/ui-visual-maintenance-archive \
            --report artifacts/ui-visual-maintenance-report.json \
            --markdown-report artifacts/ui-visual-maintenance-report.md \
            --max-age-days 0

      - name: Upload UI visual maintenance dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-server-ui-visual-maintenance-dry-run
          path: |
            artifacts/ui-visual-maintenance-report.json
            artifacts/ui-visual-maintenance-report.md
          if-no-files-found: ignore

      - name: Upload UI visual baseline diff preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-server-ui-visual-baseline-diff
          path: |
            artifacts/ui-visual-baseline-diff/visual-baseline-diff.json
            artifacts/ui-visual-baseline-diff/visual-baseline-diff.md
            artifacts/ui-visual-baseline-diff/visual-baseline-comment.md
          if-no-files-found: ignore

      - name: Publish UI visual baseline PR summary
        if: always()
        shell: bash
        run: |
          if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
            exit 0
          fi
          {
            echo "## UI Visual Baseline Diff"
            echo
            if [ -f artifacts/ui-visual-baseline-diff/visual-baseline-comment.md ]; then
              cat artifacts/ui-visual-baseline-diff/visual-baseline-comment.md
            else
              echo "visual-baseline-comment.md was not generated."
            fi
            echo
            echo "Artifact: media-server-ui-visual-baseline-diff"
          } >> "$GITHUB_STEP_SUMMARY"
