name: RC Release Gate

on:
  workflow_dispatch:
    inputs:
      run_predev_120:
        description: "Run ./server.sh verify-predev --soak-minutes 120"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      run_va_runtime_120:
        description: "Run VA runtime console 120m longrun"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      runner_label:
        description: "Runner label. Use a prepared self-hosted macOS runner for real RC gates."
        required: true
        default: "macos-latest"
        type: string
      require_va_assets:
        description: "Fail when sample/model/label assets are missing for 120m RC gates"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      artifact_retention_days:
        description: "GitHub artifact retention days for RC gate reports"
        required: true
        default: "30"
        type: string
      external_artifact_dir:
        description: "Optional mounted S3/NAS directory for external RC artifact archive"
        required: false
        default: ""
        type: string

jobs:
  rc-release-gate:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 300
    env:
      RC_ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact paths
        shell: bash
        run: |
          mkdir -p artifacts/rc-gate
          cat > artifacts/rc-gate/predev-summary.json <<'JSON'
          {"status":"missing","failCount":0,"passCount":0,"note":"run_predev_120=false"}
          JSON
          cat > artifacts/rc-gate/runtime-summary.json <<'JSON'
          {"status":"missing","failCount":0,"passCount":0,"note":"run_va_runtime_120=false"}
          JSON
          printf '# predev\n\nNot run in this workflow invocation.\n' > artifacts/rc-gate/predev-report.md
          printf '# va runtime\n\nNot run in this workflow invocation.\n' > artifacts/rc-gate/runtime-report.md

      - name: Check RC gate assets
        shell: bash
        run: |
          set -euo pipefail
          required="${{ inputs.require_va_assets }}"
          longrun="${{ inputs.run_predev_120 }}${{ inputs.run_va_runtime_120 }}"
          model="${MEDIA_SERVER_ANALYSIS_MODEL:-models/yolo11n.onnx}"
          labels="${MEDIA_SERVER_ANALYSIS_LABELS:-models/coco.names}"
          samples=(video/sample_h264.mp4 video/va_four_scene_sample.mp4)
          missing=0
          {
            echo '{'
            echo '  "schema": "media-server.rc-gate-assets.v1",'
            echo "  \"runnerLabel\": \"${{ inputs.runner_label }}\","
            echo "  \"requireVaAssets\": \"${required}\","
            echo "  \"artifactRetentionDays\": \"${{ inputs.artifact_retention_days }}\","
            echo '  "samples": ['
            first=1
            for sample in "${samples[@]}"; do
              if [[ ! -f "${sample}" ]]; then missing=$((missing + 1)); status=missing; else status=ok; fi
              [[ "${first}" -eq 1 ]] || echo ','
              first=0
              printf '    {"path":"%s","status":"%s"}' "${sample}" "${status}"
            done
            echo
            echo '  ],'
            model_status=ok
            labels_status=ok
            [[ -f "${model}" ]] || { model_status=missing; missing=$((missing + 1)); }
            [[ -f "${labels}" ]] || { labels_status=missing; missing=$((missing + 1)); }
            printf '  "model": {"path":"%s","status":"%s"},\n' "${model}" "${model_status}"
            printf '  "labels": {"path":"%s","status":"%s"}\n' "${labels}" "${labels_status}"
            echo '}'
          } > artifacts/rc-gate/asset-manifest.json
          if [[ "${longrun}" == *"true"* && "${required}" == "true" && "${missing}" -gt 0 ]]; then
            cat artifacts/rc-gate/asset-manifest.json
            echo "RC gate assets are missing; prepare sample/model/labels on the runner." >&2
            exit 1
          fi

      - name: Run predev 120m soak
        if: ${{ inputs.run_predev_120 == 'true' }}
        shell: bash
        run: |
          ./server.sh verify-predev \
            --soak-minutes 120 \
            --summary-file artifacts/rc-gate/predev-summary.json \
            --report-file artifacts/rc-gate/predev-report.md

      - name: Run VA runtime 120m longrun
        if: ${{ inputs.run_va_runtime_120 == 'true' }}
        shell: bash
        run: |
          ./server.sh verify-va-runtime-console-longrun \
            --duration-minutes 120 \
            --clients 1 \
            --include-sidechannel \
            --include-dashboard \
            --include-rtsp \
            --idle-after-cleanup-minutes 30 \
            --summary-file artifacts/rc-gate/runtime-summary.json \
            --report-file artifacts/rc-gate/runtime-report.md

      - name: Build RC release checklist
        shell: bash
        run: |
          ./server.sh rc-release-checklist \
            --predev-summary artifacts/rc-gate/predev-summary.json \
            --predev-report artifacts/rc-gate/predev-report.md \
            --runtime-summary artifacts/rc-gate/runtime-summary.json \
            --runtime-report artifacts/rc-gate/runtime-report.md \
            --output artifacts/rc-gate/rc-release-checklist.md \
            --html-output artifacts/rc-gate/rc-release-checklist.html \
            --artifact-name media-server-rc-gate \
            --asset-manifest artifacts/rc-gate/asset-manifest.json \
            --runner-label "${{ inputs.runner_label }}" \
            --artifact-retention-days "${{ inputs.artifact_retention_days }}" \
            --history-dir artifacts/rc-gate/history

      - name: Archive RC artifact to external storage
        if: ${{ inputs.external_artifact_dir != '' }}
        shell: bash
        run: |
          ./server.sh rc-artifact-archive \
            --source-dir artifacts/rc-gate \
            --destination-dir "${{ inputs.external_artifact_dir }}" \
            --run-id "${GITHUB_RUN_ID:-local}" \
            --retention-days "${{ inputs.artifact_retention_days }}"

      - name: Upload RC gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-server-rc-gate
          path: artifacts/rc-gate/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
